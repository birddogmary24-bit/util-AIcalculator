name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web \
            --dart-define=PROXY_BASE_URL=${{ secrets.PROXY_BASE_URL }} \
            --dart-define=PROXY_APP_TOKEN=${{ secrets.PROXY_APP_TOKEN }}

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=PROXY_BASE_URL=${{ secrets.PROXY_BASE_URL }} \
            --dart-define=PROXY_APP_TOKEN=${{ secrets.PROXY_APP_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
